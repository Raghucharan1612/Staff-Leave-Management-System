<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>

    <style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

:root{
    --primary:#2563eb;
    --secondary:#3b82f6;
    --light:#dbeafe;
    --extra-light:#eff6ff;
    --dark:#1e3a8a;
}

/* Body */

body{

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    flex-direction:column;

    padding:20px;

    background:

    radial-gradient(
    circle at top right,
    rgba(37,99,235,0.12),
    transparent 30%),

    radial-gradient(
    circle at bottom left,
    rgba(59,130,246,0.10),
    transparent 35%),

    #ffffff;
}

/* Remove overlay */

body::before{

    content:none;
}

/* Headings */

h1{

    color:var(--dark);

    margin-bottom:10px;

    font-size:36px;

    font-weight:bold;
}

h2{

    color:#4b5563;

    margin-bottom:25px;

    font-size:22px;
}

/* Register Box */

.register-box{

    width:420px;

    padding:35px;

    border-radius:24px;

    background:
    rgba(255,255,255,0.95);

    border:1px solid var(--light);

    backdrop-filter:blur(10px);

    box-shadow:
    0 12px 35px rgba(37,99,235,0.12);

    text-align:center;
}

/* Labels */

label{

    display:block;

    text-align:left;

    color:#374151;

    font-weight:600;

    margin-bottom:8px;

    margin-top:15px;
}

/* Inputs */

input,
select{

    width:100%;

    padding:12px;

    margin-bottom:15px;

    border:2px solid var(--light);

    border-radius:10px;

    outline:none;

    font-size:15px;

    transition:all 0.3s ease;
}

input:focus,
select:focus{

    border-color:var(--primary);

    box-shadow:
    0 0 0 4px rgba(37,99,235,0.15);
}

/* Info Text */

.info{

    color:#6b7280;

    font-size:14px;

    margin-bottom:15px;

    text-align:left;
}

/* Button */

button{

    width:100%;

    padding:14px;

    border:none;

    border-radius:12px;

    background:
    linear-gradient(
    135deg,
    var(--primary),
    var(--secondary));

    color:white;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

    transition:all 0.3s ease;

    box-shadow:
    0 8px 20px rgba(37,99,235,0.25);
}

button:hover{

    transform:translateY(-3px);

    box-shadow:
    0 12px 28px rgba(37,99,235,0.35);
}

/* Links */

.links{

    margin-top:18px;

    color:#4b5563;
}

.links a{

    color:var(--primary);

    text-decoration:none;

    font-weight:bold;

    transition:0.3s;
}

.links a:hover{

    color:var(--dark);

    text-decoration:underline;
}

/* Responsive */

@media(max-width:500px){

    .register-box{

        width:95%;

        padding:25px;
    }

    h1{

        font-size:28px;

        text-align:center;
    }

    h2{

        font-size:18px;

        text-align:center;
    }
}

</style>
</head>
<body>

    <h1>SLMS Registration</h1>
    <h2>Staff Leave Management System</h2>

    <div class="register-box">
        <form method="POST">
            {% csrf_token %}

            <label>User Name</label>
            <input type="text" name="username" placeholder="Enter Username" required>

            <label>Password</label>
            <input type="password" name="password" placeholder="Enter Password" required>

            <label>Role</label>
            <select name="role" required>
                <option value="">--- Select Role ---</option>
                <option value="admin">Admin</option>
                <option value="staff">Staff</option>
            </select>

            <p class="info">
                Admin can manage staff members and approve/reject leave requests.
            </p>

            <button type="submit">Register</button>
        </form>

        <div class="links">
            <p>
                Already have an account?
                <a href="{% url 'login' %}">Login</a>
            </p>
            <br>
            <p>
                <a href="{% url 'home' %}">← Back to Home</a>
            </p>
        </div>
    </div>

</body>
</html>
