<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

:root{
    --primary:#2563eb;
    --secondary:#3b82f6;
    --light:#dbeafe;
    --extra-light:#eff6ff;
    --dark:#1e3a8a;
    --white:#ffffff;
}

body{
    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    background-image:url("https://th.bing.com/th/id/OIP.xAIkOfR3odjeyoi5A5qfGwHaEP?w=288&h=180&c=7&r=0&o=7&dpr=1.1&pid=1.7&rm=3");

    background-size:cover;

    background-position:center;

    background-repeat:no-repeat;
}

/* White + Blue Overlay */

body::before{

    content:"";

    position:fixed;

    top:0;

    left:0;

    width:100%;

    height:100%;

    background:
    linear-gradient(
    135deg,
    rgba(255,255,255,0.75),
    rgba(219,234,254,0.55));

    z-index:-1;
}

/* Dashboard */

.dashboard{

    width:850px;

    padding:35px;

    border-radius:24px;

    background:
    rgba(255,255,255,0.75);

    backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,0.5);

    box-shadow:
    0 12px 40px rgba(37,99,235,0.15);
}

/* Header */

.header{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:30px;
}

.header h2{

    color:var(--dark);

    font-size:32px;
}

/* Header Buttons */

.header-links{

    display:flex;

    gap:15px;
}

.header-btn{

    text-decoration:none;

    color:white;

    padding:12px 20px;

    border-radius:12px;

    font-weight:bold;

    transition:0.3s;

    box-shadow:
    0 8px 18px rgba(37,99,235,0.2);
}

/* Request Button */

.request-btn{

    background:
    linear-gradient(
    135deg,
    var(--primary),
    var(--secondary));
}

.request-btn:hover{

    transform:translateY(-2px);

    box-shadow:
    0 12px 25px rgba(37,99,235,0.3);
}

/* Logout */

.logout{

    background:
    linear-gradient(
    135deg,
    #ef4444,
    #dc2626);
}

.logout:hover{

    transform:translateY(-2px);

    box-shadow:
    0 12px 25px rgba(239,68,68,0.3);
}

/* Cards */

.cards{

    display:flex;

    gap:25px;

    flex-wrap:wrap;
}

.card{

    flex:1;

    min-width:300px;

    background:
    rgba(255,255,255,0.65);

    border:1px solid var(--light);

    padding:30px;

    border-radius:18px;

    color:#374151;

    box-shadow:
    0 10px 30px rgba(37,99,235,0.10);

    transition:0.3s;
}

.card:hover{

    transform:translateY(-8px);

    box-shadow:
    0 18px 40px rgba(37,99,235,0.18);
}

.card h3{

    color:var(--dark);

    margin-bottom:15px;

    font-size:24px;
}

.card p{

    color:#4b5563;

    margin-bottom:22px;

    line-height:1.7;
}

/* Card Buttons */

.btn{

    display:inline-block;

    text-decoration:none;

    padding:12px 20px;

    border-radius:12px;

    color:white;

    font-weight:bold;

    transition:0.3s;
}

.leave-btn{

    background:
    linear-gradient(
    135deg,
    var(--primary),
    var(--secondary));
}

.leave-btn:hover{

    transform:translateY(-2px);
}

.staff-btn{

    background:
    linear-gradient(
    135deg,
    #22c55e,
    #16a34a);
}

.staff-btn:hover{

    transform:translateY(-2px);
}

/* Responsive */

@media(max-width:768px){

    .dashboard{

        width:95%;

        padding:25px;
    }

    .header{

        flex-direction:column;

        gap:20px;
    }

    .cards{

        flex-direction:column;
    }

    .header h2{

        font-size:28px;
    }
}
</style>
</head>
<body>

    <div class="dashboard">

        <div class="header">
    <h2>Admin Dashboard</h2>

    <div class="header-links">
        <a href="{% url 'view_leaves' %}" class="header-btn request-btn">
            View all Requests
        </a>

        <a href="{% url 'logout' %}" class="header-btn logout">
            Logout
        </a>
    </div>
</div>

        <div class="cards">

            <div class="card">
                <h3>Total Leave Requests</h3>
                <p>
                    View, approve, or reject staff leave applications
                    submitted through the Staff Leave Management System.
                </p>
                <a href="{% url 'view_leaves' %}" class="btn leave-btn">
                    View Requests
                </a>
            </div>

            <div class="card">
                <h3>Staff Management</h3>
                <p>
                    Manage registered staff users, review details,
                    and maintain employee records.
                </p>
                <a href="{% url 'manage_staff' %}" class="btn staff-btn">
                    Manage Staff
                </a>
            </div>

        </div>

    </div>

</body>
</html>
