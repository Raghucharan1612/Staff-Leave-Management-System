<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Staff</title>

    <style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

:root{
    --primary:#2563eb;
    --secondary:#3b82f6;
    --light:#dbeafe;
    --extra-light:#eff6ff;
    --dark:#1e3a8a;
    --white:#ffffff;
}

body{

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    margin:0;

    background:
    radial-gradient(circle at top right,
    rgba(37,99,235,0.12),
    transparent 30%),

    radial-gradient(circle at bottom left,
    rgba(59,130,246,0.10),
    transparent 35%),

    #ffffff;
}

/* Container */

.container{

    width:380px;

    background:
    rgba(255,255,255,0.95);

    border:1px solid var(--light);

    border-radius:22px;

    padding:35px;

    box-shadow:
    0 12px 35px rgba(37,99,235,0.12);

    backdrop-filter:blur(10px);
}

/* Heading */

h2{

    text-align:center;

    color:var(--dark);

    margin-bottom:28px;

    font-size:30px;

    font-weight:bold;
}

/* Labels */

label{

    display:block;

    margin-top:18px;

    margin-bottom:8px;

    font-weight:600;

    color:#374151;
}

/* Inputs */

input{

    width:100%;

    padding:12px;

    border:2px solid var(--light);

    border-radius:10px;

    background:#fff;

    font-size:15px;

    transition:all 0.3s ease;
}

input:focus{

    outline:none;

    border-color:var(--primary);

    box-shadow:
    0 0 0 4px rgba(37,99,235,0.15);
}

/* Button */

button{

    width:100%;

    margin-top:28px;

    padding:14px;

    border:none;

    border-radius:12px;

    cursor:pointer;

    font-size:16px;

    font-weight:bold;

    color:white;

    background:
    linear-gradient(
    135deg,
    var(--primary),
    var(--secondary));

    box-shadow:
    0 8px 20px rgba(37,99,235,0.25);

    transition:all 0.3s ease;
}

button:hover{

    transform:translateY(-3px);

    box-shadow:
    0 12px 28px rgba(37,99,235,0.35);
}

/* Links */

a{

    display:block;

    text-align:center;

    margin-top:18px;

    text-decoration:none;

    color:var(--primary);

    font-weight:bold;

    transition:0.3s;
}

a:hover{

    color:var(--dark);

    text-decoration:underline;
}

/* Responsive */

@media(max-width:450px){

    .container{

        width:90%;

        padding:25px;
    }

    h2{

        font-size:26px;
    }
}

</style>
</head>
<body>

    <div class="container">
        <h2>Add Staff</h2>

        <form method="POST">
            {% csrf_token %}

            <label>Username</label>
            <input type="text" name="username" required>

            <label>Password</label>
            <input type="password" name="password" required>

            <button type="submit">Create Staff</button>
        </form>

        <a href="{% url 'manage_staff' %}">
            Back to Manage Staff
        </a>
    </div>

</body>
</html>
