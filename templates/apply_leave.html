<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply Leave</title>

    <style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

:root{
    --primary:#2563eb;
    --secondary:#3b82f6;
    --light:#dbeafe;
    --extra-light:#eff6ff;
    --dark:#1e3a8a;
    --white:#ffffff;
}

/* Body */

body{

    background:
    radial-gradient(circle at top right,
    rgba(37,99,235,0.12),
    transparent 30%),

    radial-gradient(circle at bottom left,
    rgba(59,130,246,0.10),
    transparent 35%),

    #ffffff;

    display:flex;

    justify-content:center;

    align-items:center;

    min-height:100vh;

    padding:20px;
}

/* Container */

.container{

    width:450px;

    background:rgba(255,255,255,0.95);

    border:1px solid var(--light);

    border-radius:20px;

    padding:35px;

    box-shadow:
    0 12px 35px rgba(37,99,235,0.12);

    backdrop-filter:blur(10px);
}

/* Heading */

h2{

    text-align:center;

    margin-bottom:30px;

    color:var(--dark);

    font-size:30px;

    font-weight:bold;
}

/* Labels */

label{

    display:block;

    margin-top:18px;

    margin-bottom:8px;

    font-weight:600;

    color:#374151;
}

/* Inputs */

select,
input,
textarea{

    width:100%;

    padding:12px;

    border:2px solid var(--light);

    border-radius:10px;

    font-size:15px;

    background:#fff;

    transition:all 0.3s ease;
}

select:focus,
input:focus,
textarea:focus{

    outline:none;

    border-color:var(--primary);

    box-shadow:
    0 0 0 4px rgba(37,99,235,0.15);
}

/* Textarea */

textarea{

    height:100px;

    resize:none;
}

/* Submit Button */

button{

    width:100%;

    margin-top:25px;

    padding:14px;

    background:
    linear-gradient(
    135deg,
    var(--primary),
    var(--secondary));

    color:white;

    border:none;

    border-radius:12px;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

    box-shadow:
    0 8px 20px rgba(37,99,235,0.25);

    transition:all 0.3s ease;
}

button:hover{

    transform:translateY(-3px);

    box-shadow:
    0 12px 28px rgba(37,99,235,0.35);
}

/* Responsive */

@media(max-width:500px){

    .container{

        width:100%;

        padding:25px;
    }

    h2{

        font-size:26px;
    }
}
</style>
</head>
<body>

    <div class="container">

        <h2>Apply Leave</h2>

        <form method="POST">
            {% csrf_token %}

            <label>Leave Type</label>
            <select name="leave_type" required>
                <option value="">Select</option>
                <option>Casual Leave</option>
                <option>Sick Leave</option>
                <option>Emergency Leave</option>
            </select>

            <label>Start Date</label>
            <input type="date" name="start" required>

            <label>End Date</label>
            <input type="date" name="end" required>

            <label>Reason</label>
            <textarea name="reason" required></textarea>

            <button type="submit">Apply Leave</button>

        </form>

    </div>

</body>
</html>
