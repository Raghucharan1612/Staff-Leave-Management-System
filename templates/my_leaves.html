<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Leave Status</title>

    <style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

:root{
    --primary:#2563eb;
    --secondary:#3b82f6;
    --light:#dbeafe;
    --extra-light:#eff6ff;
    --dark:#1e3a8a;
    --white:#ffffff;
}

/* Body */
body{
    background:
    radial-gradient(circle at top right,
    rgba(37,99,235,0.12),
    transparent 30%),

    radial-gradient(circle at bottom left,
    rgba(59,130,246,0.10),
    transparent 35%),

    #ffffff;

    min-height:100vh;
    padding:40px;
}

/* Heading */
h2{
    text-align:center;
    margin-bottom:30px;
    color:var(--dark);
    font-size:32px;
    font-weight:bold;
}

/* Table */
table{
    width:90%;
    margin:auto;

    border-collapse:collapse;

    background:rgba(255,255,255,0.95);

    border:1px solid var(--light);

    border-radius:18px;

    overflow:hidden;

    box-shadow:
    0 10px 30px rgba(37,99,235,0.12);
}

/* Table Header */
th{

    background:
    linear-gradient(
    90deg,
    var(--primary),
    var(--secondary));

    color:white;

    padding:18px;

    font-size:16px;

    letter-spacing:0.5px;
}

/* Table Data */

td{

    padding:15px;

    text-align:center;

    border-bottom:1px solid #edf2f7;

    color:#333;
}

/* Alternate Rows */

tr:nth-child(even){

    background:#f8fbff;
}

/* Hover Effect */

tr:hover{

    background:#eaf3ff;

    transition:0.3s;
}

/* Back Button */

.back-btn{

    display:block;

    width:220px;

    margin:35px auto;

    text-align:center;

    padding:14px;

    background:
    linear-gradient(
    135deg,
    var(--primary),
    var(--secondary));

    color:white;

    text-decoration:none;

    border-radius:12px;

    font-weight:bold;

    box-shadow:
    0 8px 20px rgba(37,99,235,0.25);

    transition:all 0.3s ease;
}

.back-btn:hover{

    transform:translateY(-3px);

    box-shadow:
    0 12px 28px rgba(37,99,235,0.35);
}

/* Empty Message */

.empty-msg{

    color:#ef4444;

    font-weight:bold;

    padding:20px;
}

/* Responsive */

@media(max-width:768px){

    body{
        padding:15px;
    }

    h2{
        font-size:26px;
    }

    table{

        width:100%;

        display:block;

        overflow-x:auto;

        white-space:nowrap;
    }

    .back-btn{

        width:100%;
        max-width:250px;
    }
}
</style>

</head>
<body>

    <h2>My Leave Application</h2>

    <table>
        <tr>
            <th>Leave Type</th>
            <th>Start Date</th>
            <th>End Date</th>
            <th>Reason</th>
            <th>Status</th>
        </tr>

        {% for i in leaves %}
        <tr>
            <td>{{ i.leave_type }}</td>
            <td>{{ i.start_date }}</td>
            <td>{{ i.end_date }}</td>
            <td>{{ i.reason }}</td>
            <td>{{ i.status }}</td>
        </tr>

        {% empty %}
        <tr>
            <td colspan="5" class="empty-msg">
                No leave applications found
            </td>
        </tr>
        {% endfor %}

    </table>

    <a href="{% url 'staff_dashboard' %}" class="back-btn">
        Back to Dashboard
    </a>

</body>
</html>
