<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

:root{
    --primary:#2563eb;
    --secondary:#3b82f6;
    --light:#dbeafe;
    --extra-light:#eff6ff;
    --dark:#1e3a8a;
}

/* Body */

body{

    min-height:100vh;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    padding:20px;

    background:

    radial-gradient(
    circle at top right,
    rgba(37,99,235,0.12),
    transparent 30%),

    radial-gradient(
    circle at bottom left,
    rgba(59,130,246,0.10),
    transparent 35%),

    #ffffff;
}

/* Remove dark overlay */

body::before{

    content:none;
}

/* Heading */

h1{

    color:var(--dark);

    margin-bottom:30px;

    font-size:36px;

    font-weight:bold;
}

/* Form Container */

.form{

    width:400px;

    padding:35px;

    border-radius:24px;

    background:
    rgba(255,255,255,0.95);

    border:1px solid var(--light);

    backdrop-filter:blur(10px);

    box-shadow:
    0 12px 35px rgba(37,99,235,0.12);

    text-align:center;
}

/* Labels */

.form label{

    display:block;

    text-align:left;

    color:#374151;

    margin-bottom:8px;

    margin-top:15px;

    font-weight:600;
}

/* Inputs */

.form input{

    width:100%;

    padding:12px;

    margin-bottom:15px;

    border:2px solid var(--light);

    border-radius:10px;

    outline:none;

    font-size:15px;

    transition:all 0.3s ease;
}

.form input:focus{

    border-color:var(--primary);

    box-shadow:
    0 0 0 4px rgba(37,99,235,0.15);
}

/* Button */

.btn{

    width:100%;

    padding:14px;

    border:none;

    border-radius:12px;

    background:
    linear-gradient(
    135deg,
    var(--primary),
    var(--secondary));

    color:white;

    font-size:16px;

    font-weight:bold;

    cursor:pointer;

    transition:all 0.3s ease;

    box-shadow:
    0 8px 20px rgba(37,99,235,0.25);
}

.btn:hover{

    transform:translateY(-3px);

    box-shadow:
    0 12px 28px rgba(37,99,235,0.35);
}

/* Paragraph and Links */

.pa{

    margin-top:18px;

    color:#4b5563;

    font-size:15px;
}

.pa a{

    color:var(--primary);

    text-decoration:none;

    font-weight:bold;

    transition:0.3s;
}

.pa a:hover{

    color:var(--dark);

    text-decoration:underline;
}

/* Responsive */

@media(max-width:500px){

    .form{

        width:95%;

        padding:25px;
    }

    h1{

        font-size:28px;

        text-align:center;
    }
}

</style>
</head>

<body>
    <h1>Staff Leave Management System</h1>

    <form method="POST" class="form">
        {% csrf_token %}

        <label>Username</label>
        <input type="text" name="username" placeholder="Enter Username" required>

        <label>Password</label>
        <input type="password" name="password" placeholder="Enter Password" required>

        <button type="submit" class="btn">Login</button>
    </form>

    <p class="pa">
        Don't have an account?
        <a href="{% url 'register' %}">Register</a>
    </p>
</body>
</html>
