<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add_Staff</title>
    <style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

:root{
    --primary:#2563eb;
    --secondary:#3b82f6;
    --light:#dbeafe;
    --extra-light:#eff6ff;
    --dark:#1e3a8a;
    --white:#ffffff;
}

/* Body */

body{

    background:
    radial-gradient(circle at top right,
    rgba(37,99,235,0.12),
    transparent 30%),

    radial-gradient(circle at bottom left,
    rgba(59,130,246,0.10),
    transparent 35%),

    #ffffff;

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    gap:40px;

    padding:20px;

    flex-wrap:wrap;
}

/* Common Card Style */

nav,
.container{

    background:rgba(255,255,255,0.95);

    border:1px solid var(--light);

    border-radius:20px;

    padding:30px;

    box-shadow:
    0 12px 35px rgba(37,99,235,0.12);

    backdrop-filter:blur(10px);

    transition:0.3s;
}

nav:hover,
.container:hover{

    transform:translateY(-5px);

    box-shadow:
    0 18px 40px rgba(37,99,235,0.18);
}

/* Navigation Card */

nav{

    width:320px;
}

nav h3{

    text-align:center;

    color:var(--dark);

    margin-bottom:25px;

    font-size:28px;
}

nav h5{

    color:#374151;

    margin-top:22px;

    margin-bottom:8px;
}

nav p{

    color:#6b7280;

    margin:8px 0;
}

nav a{

    display:block;

    text-align:center;

    background:
    linear-gradient(
    135deg,
    var(--primary),
    var(--secondary));

    color:white;

    padding:12px;

    border-radius:10px;

    text-decoration:none;

    margin-top:12px;

    font-weight:bold;

    transition:all 0.3s ease;

    box-shadow:
    0 8px 18px rgba(37,99,235,0.25);
}

nav a:hover{

    transform:translateY(-2px);

    box-shadow:
    0 12px 24px rgba(37,99,235,0.35);
}

/* Form Card */

.container{

    width:380px;
}

.container h2{

    text-align:center;

    color:var(--dark);

    margin-bottom:25px;

    font-size:30px;
}

/* Labels */

label{

    display:block;

    margin-top:18px;

    margin-bottom:8px;

    font-weight:600;

    color:#374151;
}

/* Inputs */

input{

    width:100%;

    padding:12px;

    border:2px solid var(--light);

    border-radius:10px;

    outline:none;

    font-size:15px;

    transition:all 0.3s ease;
}

input:focus{

    border-color:var(--primary);

    box-shadow:
    0 0 0 4px rgba(37,99,235,0.15);
}

/* Submit Button */

button{

    width:100%;

    padding:14px;

    margin-top:25px;

    border:none;

    background:
    linear-gradient(
    135deg,
    #22c55e,
    #16a34a);

    color:white;

    font-size:16px;

    font-weight:bold;

    border-radius:12px;

    cursor:pointer;

    transition:all 0.3s ease;

    box-shadow:
    0 8px 18px rgba(34,197,94,0.25);
}

button:hover{

    transform:translateY(-2px);

    box-shadow:
    0 12px 24px rgba(34,197,94,0.35);
}

/* Back Link */

.container a{

    display:block;

    text-align:center;

    margin-top:18px;

    text-decoration:none;

    color:var(--primary);

    font-weight:bold;

    transition:0.3s;
}

.container a:hover{

    color:var(--dark);

    text-decoration:underline;
}

/* Responsive */

@media(max-width:850px){

    body{

        flex-direction:column;

        gap:25px;
    }

    nav,
    .container{

        width:100%;

        max-width:420px;
    }
}
</style>
</head>
<body>
    <nav>
        <h3>
            welcome,{{request.user.username}}
        </h3>
        <h5>Apply Leave</h5>
        <p>Submit a new leave request</p>
        <a href="{% url 'apply_leave' %}"> Apply</a>
        <h5>My Leave Status</h5>
        <p>View your leave requests</p>
        <a href="{% url 'my_leaves' %}">
            View
        </a>
        <a href="{% url 'login' %}">Back to Manage Staff</a>
    </nav>

        </form>

        <a href="{% url 'manage_staff' %}">Back to Manage Staff</a>

</body>
</html>
